<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports — Aarogyam Patient</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body data-page="reports">
<header class="pt-topnav">
  <div class="pt-topnav-inner">
    <a class="pt-brand" href="overview.html"><svg width="24" height="24" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="8.5" stroke="#2d6a4f" stroke-width="1.5"/><path d="M7 17h5l2.5-6 3.5 10 2.5-6.5L22 17h3" stroke="#40916c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Aarogyam</a>
    <nav class="pt-links">
      <a href="overview.html">Overview</a>
      <a href="medical-history.html">Medical History</a>
      <a href="reports.html">Reports</a>
    </nav>
    <div class="pt-actions">
      <div>
        <button class="pt-icon-btn" id="notifBellBtn" type="button" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span class="pt-dot" id="notifDot" hidden></span>
        </button>
        <div class="pt-popover" id="notifPopover" hidden>
          <div class="pt-popover-head">Unread notifications</div>
          <div class="pt-popover-list" id="notifPopoverList"><div class="table-loading">Loading…</div></div>
        </div>
      </div>
      <div>
        <button class="pt-avatar-btn" id="avatarBtn" type="button" aria-label="Account"><span class="avatar-circle small" id="sidebarInitials">P</span></button>
        <div class="pt-popover" id="avatarPopover" hidden>
          <div class="pt-account-card"><div class="pt-account-name" id="sidebarProfileName">Patient</div><div class="pt-account-meta" id="sidebarProfileMeta">Aarogyam ID</div></div>
          <div class="pt-popover-menu">
            <a href="profile.html">Profile &amp; settings</a>
            <button class="danger" id="logoutBtn" type="button">Log out</button>
          </div>
        </div>
      </div>
    </div>
    <button class="pt-mobile-toggle" id="mobileNavToggle" type="button" aria-label="Menu"><span></span></button>
  </div>
  <nav class="pt-mobile-links">
    <a href="overview.html">Overview</a>
    <a href="medical-history.html">Medical History</a>
    <a href="reports.html">Reports</a>
  </nav>
</header>
<main class="pt-main">
  <div class="pt-content">
    <div class="page-head-row"><div><h2>Medical reports</h2><p>All lab reports, scans and documents linked to your record.</p></div><button class="btn btn-solid btn-sm" id="openUploadBtn" type="button">Upload report</button></div>
    <div class="table-wrap"><table class="data-table"><thead><tr><th>Report</th><th>Date</th><th>Visit</th><th>Size</th><th>Uploaded by</th><th></th></tr></thead><tbody id="reportsBody"><tr><td colspan="6" class="table-loading">Loading reports…</td></tr></tbody></table></div>
  </div>
</main>
<div class="modal-overlay" id="uploadModal" hidden><div class="modal"><div class="modal-head"><h3>Upload medical report</h3><button class="modal-close" type="button" data-close-modal="uploadModal" aria-label="Close">×</button></div><div class="modal-body"><div id="uploadAlert" class="form-alert error" hidden></div><form id="uploadForm" novalidate><div class="form-row"><label for="reportTitle">Title<span class="req">*</span></label><input id="reportTitle" type="text" maxlength="200" required></div><div class="form-row-2col"><div class="form-row"><label for="reportType">Report type<span class="req">*</span></label><input id="reportType" type="text" maxlength="50" required></div><div class="form-row"><label for="reportDate">Report date</label><input id="reportDate" type="date"></div></div><div class="form-row"><label for="reportVisitId">Link to visit</label><select id="reportVisitId"><option value="">None</option></select></div><div class="form-row"><label>File<span class="req">*</span></label><label class="dropzone" id="reportDropzone"><input id="reportFile" type="file" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx"><span>Drop a file here or click to browse.</span><div class="filename" id="reportFilename">No file selected</div></label></div><div class="modal-actions"><button class="btn btn-ghost" type="button" data-close-modal="uploadModal">Cancel</button><button class="btn btn-solid" id="uploadSubmitBtn" type="submit">Upload report</button></div></form></div></div></div>
<div id="toastHost"></div>
<script src="app.js?v=3"></script>
<script src="portal.js?v=3"></script>
</body>
</html>
